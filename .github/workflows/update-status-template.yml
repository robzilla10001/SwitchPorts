name: Update status template from README
 
on:
  push:
    branches: [main]          # change if your default branch is different
    paths:
      - README.md
      - .github/scripts/generate_status_template.py
  workflow_dispatch:          # lets you run it manually from the Actions tab
 
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          
      - name: Regenerate issue form
        run: python3 .github/scripts/generate_status_template.py
 
      - name: Commit if changed
        run: |
          if git diff --quiet -- .github/ISSUE_TEMPLATE/issue.yml; then
            echo "Issue template already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/issue.yml
          git commit -m "Update issue template from README"
          git push_template.py
