name: Update status
description: Post an update to a game status
title: "Status: "
labels: ["table-update"]
assignees: ["Creators/Testers only"]
body:
  - type: dropdown
    id: section
    attributes:
      label: System
      description: The System Header
      options:
        - Emulators
        - Android 32bit
        - Android 64bit
        - Arcade
        - Nintendo Gameboy
        - Nintendo Gameboy Color
        - Nintendo Gameboy Advance
        - Nintendo GameCube
        - Sega Genesis
        - Nintendo 64
        - PC
        - Sony Playstation
        - Sony Playstation 2
        - Super Nintendo Entertainment System
        - Microsoft Xbox
        - Microsoft Xbox 360
        - Nintendo Wii U
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game
      description: Must exactly match the first column of the existing row (leave off 🟢)
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      description: Project progress
      options:
        - ⬛️ = Does not boot
        - 🟥 = Game boots to title
        - 🟧 = Boots into game, unplayable
        - 🟨 = Playable
        - 🟩 = Completable
        - ✳️ = Feature complete; only sporadic bug fixes, enhancements and QOL improvements remain.
    validations:
      required: true
